<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ESP32 XR Controller Test Game</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene xr-mode-ui="XRMode: xr" webxr="optionalFeatures: local-floor, hit-test;">
        
        <a-sky id="background" color="#000000" material="transparent: true; opacity: 0;"></a-sky>

        <a-entity id="cameraRig" position="0 0 0">
            <a-camera id="head" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>
        </a-entity>

        <a-entity id="leftController" laser-controls="hand: left" raycaster="objects: .target; far: 5; enabled: true"></a-entity>
        <a-entity id="rightController" laser-controls="hand: right" raycaster="objects: .target; far: 5; enabled: true"></a-entity>
        <a-entity id="targets-container"></a-entity>

        <a-sphere id="test-balloon" class="target" color="blue" radius="0.15" position="0 1.5 -1"></a-sphere>

    </a-scene>

    <script>
        const container = document.getElementById('targets-container');

        // ה-WebSocket מנוטרל זמנית כדי לוודא שה-VR מגיב פיקס
        const socket = null;

        // ========================================================
        // מנגנון הלחיצה הרשמי של A-Frame: עובד ישירות מול קרן הלייזר
        // ========================================================
        window.addEventListener('DOMContentLoaded', () => {
            
            // האזנה ללחיצה על הבלון הכחול הקבוע
            document.getElementById('test-balloon').addEventListener('click', function (evt) {
                popTarget(evt.target);
            });

            // האזנה לכל בלון אדום חדש שיווצר בתוך המיכל
            container.addEventListener('click', function (evt) {
                if (evt.target.classList.contains('target')) {
                    popTarget(evt.target);
                }
            });
        });

        // פונקציית הפיצוץ והמחיקה
        function popTarget(targetEntity) {
            if (targetEntity && targetEntity.parentNode) {
                // מחיקת הבלון מהעולם במיידי
                targetEntity.parentNode.removeChild(targetEntity);
                
                // שליחה ל-ESP32 בעתיד (כשנחזיר אותו)
                if (socket && socket.readyState === 1) {
                    socket.send("BALLOON_POPPED");
                }
            }
        }
        // ========================================================

        // מנגנון ייצור אוטומטי: בלון אדום חדש בכל 3 שניות
        setInterval(() => {
            spawnTarget();
        }, 3000); 

        // פונקציה לייצור בלונים אדומים במרחב
        function spawnTarget() {
            const newTarget = document.createElement('a-sphere');
            newTarget.setAttribute('class', 'target');
            newTarget.setAttribute('color', 'red');
            newTarget.setAttribute('radius', '0.15');

            // פיזור נוח מסביב למשתמש
            const x = (Math.random() * 1.6) - 0.8;   // מ-80 ס"מ שמאלה עד 80 ס"מ ימינה
            const y = (Math.random() * 0.6) + 1.2;   // גובה נוח לעיניים (1.2 עד 1.8 מטר)
            const z = -(Math.random() * 1.0) - 0.5;  // מרחק קדימה (בין חצי מטר למטר וחצי)

            newTarget.setAttribute('position', `${x} ${y} ${z}`);
            container.appendChild(newTarget);
        }
    </script>
</body>
</html>
