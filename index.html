<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ESP32 XR Hand Tracking Target Game</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script>
        // ========================================================
        // הגדרת ה-WebSocket (מנוטרל זמנית לבדיקה)
        // ========================================================
        const socket = null;

        // ========================================================
        // רישום הרכיב חובה לפני ה-HTML!
        // הקוד הזה יקשיב לכל פעם שרשת היד הווירטואלית נוגעת בבלון
        // ========================================================
        AFRAME.registerComponent('collider-check', {
            init: function () {
                this.el.addEventListener('raycaster-intersection', (evt) => {
                    const intersectedEls = evt.detail.els;
                    intersectedEls.forEach(targetEntity => {
                        if (targetEntity.classList.contains('target')) {
                            // 1. העלמת הבלון
                            targetEntity.parentNode.removeChild(targetEntity);
                            
                            // 2. שליחה ל-ESP32 (יופעל בהמשך)
                            if (socket && socket.readyState === 1) {
                                socket.send("BALLOON_POPPED");
                            }
                        }
                    });
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene xr-mode-ui="XRMode: xr" webxr="optionalFeatures: local-floor, hand-tracking, hit-test;">
        
        <a-sky id="background" color="#000000" material="transparent: true; opacity: 0;"></a-sky>

        <a-entity id="cameraRig" position="0 0 0">
            <a-camera id="head" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>
        </a-entity>

        <a-entity id="leftHand" 
                  hand-tracking-controls="hand: left; modelStyle: mesh;"
                  raycaster="objects: .target; far: 0.15; showLine: false; enabled: true"
                  collider-check>
        </a-entity>

        <a-entity id="rightHand" 
                  hand-tracking-controls="hand: right; modelStyle: mesh;"
                  raycaster="objects: .target; far: 0.15; showLine: false; enabled: true"
                  collider-check>
        </a-entity>

        <a-entity id="targets-container"></a-entity>

        <a-sphere id="test-balloon" class="target" color="blue" radius="0.1" position="0 1.4 -0.5"></a-sphere>

    </a-scene>

    <script>
        const container = document.getElementById('targets-container');

        // מנגנון ייצור אוטומטי: בלון אדום חדש בכל 4 שניות
        setInterval(() => {
            spawnTarget();
        }, 4000); 

        // פונקציה לייצור בלונים אדומים קרובים ונוחים
        function spawnTarget() {
            const newTarget = document.createElement('a-sphere');
            newTarget.setAttribute('class', 'target');
            newTarget.setAttribute('color', 'red');
            newTarget.setAttribute('radius', '0.1');

            // מיקומים נגישים במרחק נגיעה קל
            const x = (Math.random() * 0.4) - 0.2;   // 20 ס"מ ימינה או שמאלה
            const y = (Math.random() * 0.2) + 1.3;   // גובה נוח
            const z = -(Math.random() * 0.3) - 0.4;  // קרוב מאוד (40 עד 70 ס"מ)

            newTarget.setAttribute('position', `${x} ${y} ${z}`);
            container.appendChild(newTarget);
        }
    </script>
</body>
</html>
