<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ESP32 XR Hand Tracking Target Game</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene xr-mode-ui="XRMode: xr" webxr="optionalFeatures: hit-test; requiredFeatures: local-floor, hand-tracking;">
        
        <a-entity id="cameraRig" position="0 0 0">
            <a-camera id="head" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>
        </a-entity>

        <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh;"></a-entity>
        <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh;"></a-entity>

        <a-entity id="targets-container"></a-entity>

        <a-sphere id="test-balloon" class="target" color="blue" radius="0.15" position="0 1.5 -1"></a-sphere>

    </a-scene>

    <script>
        const container = document.getElementById('targets-container');
        const leftHand = document.getElementById('leftHand');
        const rightHand = document.getElementById('rightHand');

        // ========================================================
        // הגדרת תקשורת WebSocket מול ה-ESP32
        // ========================================================
        const esp32IP = "192.168.43.50"; // ודא שזה ה-IP הנוכחי של הבקר מההוטספוט
        const socket = new WebSocket(`ws://${esp32IP}:81`);

        socket.onopen = () => console.log("Connected to ESP32!");
        socket.onclose = () => console.log("Disconnected from ESP32");
        socket.onerror = (error) => console.error("WebSocket Error: ", error);
        // ========================================================

        // לולאת בדיקת התנגשויות (רצה כל 50 מילישניות)
        setInterval(() => {
            const targets = document.querySelectorAll('.target');
            targets.forEach(target => {
                checkHandCollision(target, leftHand);
                checkHandCollision(target, rightHand);
            });
        }, 50);

        // פונקציית בדיקת מרחק והתנגשות
        function checkHandCollision(targetEntity, handEntity) {
            if (!targetEntity || !targetEntity.object3D) return;
            const targetPos = targetEntity.object3D.position;

            if (!handEntity || !handEntity.object3D || !handEntity.object3D.visible) return;
            const handPos = handEntity.object3D.position;

            const distance = Math.sqrt(
                Math.pow(targetPos.x - handPos.x, 2) +
                Math.pow(targetPos.y - handPos.y, 2) +
                Math.pow(targetPos.z - handPos.z, 2)
            );

            if (distance < 0.25) {
                targetEntity.remove(); // מחיקת הבלון שנגעו בו
                
                // שליחת הדיווח החומרתי ל-ESP32
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send("BALLOON_POPPED");
                }

                // יצירת בלון חדש במקום אקראי
                spawnTarget();
            }
        }

        // פונקציה לייצור מטרות חדשות בצורה בטוחה
        function spawnTarget() {
            const newTarget = document.createElement('a-sphere');
            newTarget.setAttribute('class', 'target');
            newTarget.setAttribute('color', 'red');
            newTarget.setAttribute('radius', '0.15');

            // מיקומים רנדומליים קרובים מול המשתמש
            const x = (Math.random() * 1.0) - 0.5; // בין 50 ס"מ שמאלה ל-50 ס"מ ימינה
            const y = (Math.random() * 0.4) + 1.3; // גובה הכתפיים/עיניים (1.3 עד 1.7 מטר)
            const z = -(Math.random() * 0.5) - 0.4; // מרחק קדימה בין 40 ס"מ ל-90 ס"מ

            newTarget.setAttribute('position', `${x} ${y} ${z}`);
            container.appendChild(newTarget);
        }
    </script>
</body>
</html>
