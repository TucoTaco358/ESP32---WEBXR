<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ESP32 VR Connection Test</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.min.js"></script>
  </head>
  <body>
    
    <a-scene xr-mode-ui="enabled: true; enterAREnabled: true; enterVREnabled: true;" 
         webxr="optionalFeatures: local-floor, raycaster, hit-test;">
      
      <a-sky id="background" color="#000000" material="transparent: true; opacity: 0;"></a-sky>

      <a-entity id="cameraRig" position="0 0 0">
        <a-camera id="head" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>
      </a-entity>

      <a-text id="connection-status" 
              value="Connecting to ESP32 Hardware..." 
              color="orange" 
              position="0 1.5 -0.5" 
              scale="0.4 0.4 0.4" 
              align="center">
      </a-text>

      <a-box id="test-target" 
             class="raycastable"
             position="0 1.1 -0.5" 
             rotation="0 45 0" 
             width="0.1" height="0.1" depth="0.1" 
             material="color: #4CC3D9">
      </a-box>

      <a-entity laser-controls="hand: left" raycaster="objects: .raycastable; far: 5;"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .raycastable; far: 5;"></a-entity>
      
    </a-scene>

    <script>
        const statusText = document.getElementById('connection-status');
        const testTarget = document.getElementById('test-target');
        let socket = null;

        // ========================================================
        // ניהול תקשורת ה-WebSocket מול ה-ESP32 (פורט 81)
        // ========================================================
        function connectWebSocket() {
            // window.location.hostname מושך אוטומטית את ה-IP שהקלדת במשקפת
            socket = new WebSocket(`ws://${window.location.hostname}:81`);

            socket.onopen = () => {
                console.log("Connected to ESP32! 🟢");
                statusText.setAttribute('value', 'ESP32 Connected 🟢');
                statusText.setAttribute('color', 'green');
            };

            socket.onclose = () => {
                console.log("Disconnected from ESP32 🔴");
                statusText.setAttribute('value', 'ESP32 Disconnected 🔴 (Retrying...)');
                statusText.setAttribute('color', 'red');
                // ניסיון חיבור מחדש אוטומטי כל 3 שניות אם הניתוק לא מכוון
                setTimeout(connectWebSocket, 3000); 
            };

            socket.onerror = (error) => {
                console.error("WebSocket Error ⚠️", error);
            };
        }

        // הפעלת החיבור מיד עם טעינת הדף
        connectWebSocket();
        // ========================================================

        // האזנה ללחיצת ההדק (Trigger) בשלט כאשר הלייזר מצביע על הקובייה
        testTarget.addEventListener('click', function (evt) {
            // שינוי צבע זמני של הקובייה בירוק כאינדיקציה ויזואלית מיידית במשקפת
            testTarget.setAttribute('material', 'color: #7BC8A4');
            
            // שליחת האות המדויק שה-ESP32 מצפה לו ב-onWebSocketEvent
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send("BALLOON_POPPED");
                console.log("Sent: BALLOON_POPPED 💥");
            }

            // החזרת הצבע המקורי לאחר 200 מילישניות
            setTimeout(() => {
                testTarget.setAttribute('material', 'color: #4CC3D9');
            }, 200);
        });
    </script>
  </body>
</html>
