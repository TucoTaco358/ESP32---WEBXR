<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ESP32 XR Hand Tracking Pure Game</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene xr-mode-ui="XRMode: xr" webxr="requiredFeatures: local-floor, hand-tracking; optionalFeatures: hit-test;">
        
        <a-sky id="background" color="#000000" material="transparent: true; opacity: 0;"></a-sky>

        <a-entity id="cameraRig" position="0 0 0">
            <a-camera id="head" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>
        </a-entity>

        <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh;"></a-entity>
        <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh;"></a-entity>

        <a-entity id="targets-container"></a-entity>

        <a-sphere id="test-balloon" class="target" color="blue" radius="0.12" position="0 1.4 -0.5"></a-sphere>

    </a-scene>

    <script>
        const container = document.getElementById('targets-container');

        // ה-WebSocket מנוטרל זמנית לבדיקה
        const socket = null;

        // ========================================================
        // הלולאה המתמטית: רצה בכל פריים של ה-VR (60-90 פעמים בשנייה)
        // היא בודקת את המרחק האמיתי בין הידיים לבלונים ללא תלות ב-Raycaster
        // ========================================================
        const sceneEl = document.querySelector('a-scene');
        
        sceneEl.addEventListener('render-target-loaded', () => {
            sceneEl.renderer.setAnimationLoop((time, frame) => {
                if (!frame) return;

                const leftHandEl = document.getElementById('leftHand');
                const rightHandEl = document.getElementById('rightHand');

                // בדיקת התנגשות עבור יד שמאל ויד ימין
                checkCollision(leftHandEl, frame);
                checkCollision(rightHandEl, frame);
            });
        });

        function checkCollision(handEntity, frame) {
            // ודא שהיד קיימת, נטענה בתוך A-Frame ונראית לעין
            if (!handEntity || !handEntity.object3D || !handEntity.visible) return;

            // שליפת מיקום כף היד של המשתמש במרחב התלת-ממדי של החדר
            const handPos = new THREE.Vector3();
            handEntity.object3D.getWorldPosition(handPos);

            // לולאה שעוברת על כל הבלונים שקיימים כרגע במסך
            const targets = document.querySelectorAll('.target');
            targets.forEach(target => {
                if (!target.object3D) return;

                const targetPos = new THREE.Vector3();
                targetEntity = target;
                target.object3D.getWorldPosition(targetPos);

                // חישוב המרחק הוקטורי המדויק בין מרכז כף היד למרכז הבלון
                const distance = targetPos.distanceTo(handPos);

                // הגדרנו טווח פגיעה נדיב של 30 ס"מ (0.3 מטר)
                if (distance < 0.30) {
                    // פוצץ ומחק את הבלון מהעולם במיידי!
                    target.parentNode.removeChild(target);

                    // שליחה ל-ESP32 (יופעל בהמשך כשנחזיר את ה-WebSocket)
                    if (socket && socket.readyState === 1) {
                        socket.send("BALLOON_POPPED");
                    }
                }
            });
        }
        // ========================================================

        // מנגנון ייצור אוטומטי: בלון אדום חדש בכל 3 שניות
        setInterval(() => {
            spawnTarget();
        }, 3000); 

        // פונקציה לייצור בלונים אדומים קרובים ונוחים לנגיעה
        function spawnTarget() {
            const newTarget = document.createElement('a-sphere');
            newTarget.setAttribute('class', 'target');
            newTarget.setAttribute('color', 'red');
            newTarget.setAttribute('radius', '0.12');

            // מיקומים רנדומליים ממש קרובים אליך (בין 40 ל-70 ס"מ מהמשקפיים)
            const x = (Math.random() * 0.6) - 0.3;   // 30 ס"מ ימינה או שמאלה
            const y = (Math.random() * 0.3) + 1.3;   // גובה נוח ליד
            const z = -(Math.random() * 0.3) - 0.4;  // קרוב מאוד קדימה

            newTarget.setAttribute('position', `${x} ${y} ${z}`);
            container.appendChild(newTarget);
        }
    </script>
</body>
</html>
