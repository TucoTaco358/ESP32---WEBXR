<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ESP32 XR Hand & Controller Perfect Game</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene xr-mode-ui="XRMode: xr" webxr="optionalFeatures: local-floor, hand-tracking, hit-test;">
        
        <a-sky id="background" color="#000000" material="transparent: true; opacity: 0;"></a-sky>

        <a-entity id="cameraRig" position="0 0 0">
            <a-camera id="head" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>
        </a-entity>

        <a-entity id="leftHand" 
                  laser-controls="hand: left" 
                  hand-tracking-controls="hand: left; modelStyle: mesh;"
                  raycaster="objects: .target; far: 2; enabled: true">
        </a-entity>

        <a-entity id="rightHand" 
                  laser-controls="hand: right" 
                  hand-tracking-controls="hand: right; modelStyle: mesh;"
                  raycaster="objects: .target; far: 2; enabled: true">
        </a-entity>

        <a-entity id="targets-container"></a-entity>

        <a-sphere id="test-balloon" class="target" color="blue" radius="0.12" position="0 1.4 -0.5"></a-sphere>

    </a-scene>

    <script>
        const container = document.getElementById('targets-container');

        // ה-WebSocket מנוטרל זמנית לבדיקת יציבות
        const socket = null;

        // האזנה מובנית לכל סוגי הלחיצות (גם לייזר מהשלט וגם קליק/צביטה מהידיים)
        window.addEventListener('DOMContentLoaded', () => {
            
            // לחיצה על הבלון הכחול
            document.getElementById('test-balloon').addEventListener('click', function (evt) {
                popTarget(evt.target);
            });

            // לחיצה על בלון אדום כלשהו בתוך המיכל
            container.addEventListener('click', function (evt) {
                if (evt.target.classList.contains('target')) {
                    popTarget(evt.target);
                }
            });
        });

        // פונקציית הפיצוץ והמחיקה הרשמית
        function popTarget(targetEntity) {
            if (targetEntity && targetEntity.parentNode) {
                targetEntity.parentNode.removeChild(targetEntity);
                
                // שליחה ל-ESP32 (יופעל בהמשך)
                if (socket && socket.readyState === 1) {
                    socket.send("BALLOON_POPPED");
                }
            }
        }

        // מנגנון ייצור אוטומטי: בלון אדום חדש בכל 3 שניות
        setInterval(() => {
            spawnTarget();
        }, 3000); 

        // פונקציה לייצור בלונים אדומים קרובים ונגישים
        function spawnTarget() {
            const newTarget = document.createElement('a-sphere');
            newTarget.setAttribute('class', 'target');
            newTarget.setAttribute('color', 'red');
            newTarget.setAttribute('radius', '0.12');

            // מיקומים בטווח נגיעה קרוב מול הפנים
            const x = (Math.random() * 0.6) - 0.3;   // 30 ס"מ ימינה או שמאלה
            const y = (Math.random() * 0.3) + 1.3;   // גובה נוח
            const z = -(Math.random() * 0.4) - 0.4;  // קרוב מאוד (40 עד 80 ס"מ)

            newTarget.setAttribute('position', `${x} ${y} ${z}`);
            container.appendChild(newTarget);
        }
    </script>
</body>
</html>
