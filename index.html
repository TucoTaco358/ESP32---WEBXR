<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ESP32 XR Hand Laser Game</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene xr-mode-ui="XRMode: xr" webxr="requiredFeatures: local-floor, hand-tracking; optionalFeatures: hit-test;">
        
        <a-sky id="background" color="#000000" material="transparent: true; opacity: 0;"></a-sky>

        <a-entity id="cameraRig" position="0 0 0">
            <a-camera id="head" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>
        </a-entity>

        <a-entity id="leftHand" 
                  laser-controls="hand: left" 
                  raycaster="objects: .target; far: 4; showLine: true;"
                  line="color: white; opacity: 0.8">
        </a-entity>

        <a-entity id="rightHand" 
                  laser-controls="hand: right" 
                  raycaster="objects: .target; far: 4; showLine: true;"
                  line="color: white; opacity: 0.8">
        </a-entity>
        <a-entity id="targets-container"></a-entity>

        <a-sphere id="test-balloon" class="target" color="blue" radius="0.15" position="0 1.4 -1"></a-sphere>

    </a-scene>

    <script>
        const container = document.getElementById('targets-container');

        // ה-WebSocket מנוטרל זמנית לצורך הבדיקה
        const socket = null;

        // ========================================================
        // מנגנון קליטת הלחיצות הרשמי של A-Frame
        // מקשיב לאירוע ה-'click' שנוצר כתוצאה ממחוות הצביטה
        // ========================================================
        window.addEventListener('DOMContentLoaded', () => {
            
            // האזנה לצביטה על הבלון הכחול
            document.getElementById('test-balloon').addEventListener('click', function (evt) {
                popTarget(evt.target);
            });

            // האזנה לצביטה על בלון אדום כלשהו שנוצר בדינמיות
            container.addEventListener('click', function (evt) {
                if (evt.target.classList.contains('target')) {
                    popTarget(evt.target);
                }
            });
        });

        // פונקציית הפיצוץ והמחיקה מהעולם
        function popTarget(targetEntity) {
            if (targetEntity && targetEntity.parentNode) {
                // מחיקה מיידית מהמסך
                targetEntity.parentNode.removeChild(targetEntity);
                
                // שליחה ל-ESP32 (יופעל בהמשך כשנחזיר את הרשת)
                if (socket && socket.readyState === 1) {
                    socket.send("BALLOON_POPPED");
                }
            }
        }
        // ========================================================

        // מנגנון ייצור אוטומטי: בלון אדום חדש בכל 3 שניות
        setInterval(() => {
            spawnTarget();
        }, 3000); 

        // פונקציה לייצור בלונים אדומים במרחב
        function spawnTarget() {
            const newTarget = document.createElement('a-sphere');
            newTarget.setAttribute('class', 'target');
            newTarget.setAttribute('color', 'red');
            newTarget.setAttribute('radius', '0.15');

            // פיזור נוח מול המשתמש
            const x = (Math.random() * 1.2) - 0.6;   // 60 ס"מ ימינה או שמאלה
            const y = (Math.random() * 0.5) + 1.2;   // גובה נוח לעיניים
            const z = -(Math.random() * 1.0) - 0.6;  // מרחק קדימה (בין 60 ס"מ למטר וחצי)

            newTarget.setAttribute('position', `${x} ${y} ${z}`);
            container.appendChild(newTarget);
        }
    </script>
</body>
</html>
